<div class="editor-page">
  <div class="editor-heading">
    <a class="back-link" routerLink="/" [queryParams]="{ id: id }">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 6-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
      Climb
    </a>
    <h1>Edit problem</h1>
    <p>{{isArt ? 'Choose a color, then tap holds to paint.' : 'Tap holds to build your route.'}}</p>
  </div>
  <p *ngIf="isLoading" class="editor-status" role="status">Loading problem…</p>
  <div *ngIf="error" class="editor-error" role="alert">
    <p>{{error}}</p>
    <a routerLink="/">Return to Climb</a>
  </div>
  <form *ngIf="problem && !isLoading" (ngSubmit)="updateProblem()">
    <div class="editor-color" [style.display]="isArt ? 'flex' : 'none'">
      <label for="color">Hold color</label>
      <input #colorInput data-lpignore="true" id="color" class="form-control color-input" [type]="hasHuebee ? 'text' : 'color'" [readOnly]="hasHuebee" [value]="currentColor.hex" (input)="setColor($event.target.value)" />
    </div>
    <div class="editor-board">
      <problem [readonly]="false" [class.is-invalid]="isProblemInvalid" [problem]="problem" [artColor]="currentColor" (onProblemChanged)="onProblemChanged($event)"></problem>
      <p *ngIf="isProblemInvalid" class="field-error" role="alert">{{problemError}}</p>
    </div>
    <div class="editor-fields">
      <div class="editor-field">
        <label for="name">Name</label>
        <input data-lpignore="true" type="text" class="form-control" id="name" name="name" placeholder="Problem name" [class.is-invalid]="isNameInvalid" [attr.aria-invalid]="isNameInvalid || null" [attr.aria-describedby]="isNameInvalid ? 'name-error' : null" [(ngModel)]="problem.name" />
        <p *ngIf="isNameInvalid" class="field-error" id="name-error">Enter a problem name.</p>
      </div>
      <div class="editor-field">
        <label for="setter">Setter</label>
        <input data-lpignore="true" type="text" class="form-control" id="setter" name="setter" placeholder="Setter name" [class.is-invalid]="isSetterNameInvalid" [attr.aria-invalid]="isSetterNameInvalid || null" [attr.aria-describedby]="isSetterNameInvalid ? 'setter-error' : null" [(ngModel)]="problem.setter" />
        <p *ngIf="isSetterNameInvalid" class="field-error" id="setter-error">Enter the setter's name.</p>
      </div>
      <div class="editor-field editor-field-wide">
        <label for="notes">Notes <span>Optional</span></label>
        <textarea data-lpignore="true" class="form-control" id="notes" name="notes" rows="3" placeholder="Beta, rules, or anything to remember." [(ngModel)]="problem.notes"></textarea>
      </div>
      <div class="editor-field editor-field-wide difficulty-field">
        <label id="difficulty-label">Difficulty</label>
        <div class="difficulty-slider">
          <nouislider [config]="sliderConfig" id="difficulty" name="difficulty" aria-labelledby="difficulty-label" [(ngModel)]="difficulty"></nouislider>
        </div>
      </div>
    </div>
    <p *ngIf="saveError" class="editor-error" role="alert">{{saveError}}</p>
    <div class="editor-actions">
      <a class="btn btn-outline-secondary" routerLink="/" [queryParams]="{ id: id }">Cancel</a>
      <button type="submit" class="btn btn-primary" [disabled]="isSaving">{{isSaving ? 'Saving…' : 'Save changes'}}</button>
    </div>
  </form>
</div>
