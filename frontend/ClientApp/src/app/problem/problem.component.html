<div #boardStage class="board-stage">
<div class="problem-container" [class.contained]="fitToContainer"
     [style.width.px]="fitToContainer ? fittedWidth : null"
     [style.height.px]="fitToContainer ? fittedHeight : null">
    <div class="problem" [ngClass]="setup"
         (mouseleave)="endDrawing()" (mouseup)="endDrawing()">
        <ng-container *ngFor="let row of cells">
            <div class="board-cell" *ngFor="let cell of row">
                <button *ngIf="cell.type === 'hold'" type="button" class="hold"
                        [disabled]="readonly || !problem || !problem.route"
                        [attr.aria-label]="'Hold ' + (cell.index + 1) + (cell.holdType ? ': ' + cell.holdType : '')"
                        [class.FEET]="cell.holdType === 'FEET'"
                        [class.START]="cell.holdType === 'START'"
                        [class.MOVES]="cell.holdType === 'MOVES'"
                        [class.TOP]="cell.holdType === 'TOP'"
                        [style.background-color]="isArt && cell.holdType === 'RGB' ? cell.color : ''"
                        (mouseenter)="isArt && isDrawing ? onHoldTouched(cell.index) : null"
                        (mousedown)="startDrawing(); isArt ? onHoldTouched(cell.index) : null"
                        (click)="isArt ? ($event.detail === 0 ? onHoldTouched(cell.index) : null) : onHoldSelected(cell.index)">
                </button>
            </div>
        </ng-container>
    </div>
</div>
</div>
<div *ngIf="showControls" class="board-controls">
    <button type="button" class="lighting-button"
            [class.active]="lastSentLighting === true" [attr.aria-pressed]="lastSentLighting === true"
            [disabled]="!autoSend || readonly || (!problem || !problem.route)"
            (click)="toggleLighting()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M9 18h6M10 21h4M15.1 13.9a6 6 0 1 0-6.2 0C9.7 14.6 10 15.3 10 16h4c0-.7.3-1.4 1.1-2.1Z"></path>
        </svg>
        {{lastSentLighting === null ? 'Light problem' : (lastSentLighting ? 'Lights on' : 'Lights off')}}
    </button>
    <span class="lighting-status" role="status" aria-live="polite">{{isSending ? 'Sending…' : lightingStatus}}</span>
    <div *ngIf="lightingError" class="lighting-error" role="alert">
        <span>{{lightingError}}</span>
        <button type="button" class="retry-button" (click)="retryLighting()">Retry</button>
    </div>
</div>
