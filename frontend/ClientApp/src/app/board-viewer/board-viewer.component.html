<div class="viewer" (keydown)="onKeyDown($event)">
    <div #gestureArea class="gesture-area" [class.zoomed]="isZoomed" tabindex="0" role="img"
         [attr.aria-label]="'Board for ' + (problem?.name || 'this problem') + '. Pinch to zoom, or use the plus and minus keys. Press zero to reset.'">
        <div class="board-surface" [style.transform]="surfaceTransform" aria-hidden="true">
            <problem [problem]="problem" [readonly]="true" [showControls]="false" [autoSend]="false" [fitToContainer]="true"></problem>
        </div>
    </div>
    <button type="button" class="viewer-control viewer-close" aria-label="Close board viewer" (click)="close()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
            <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
        <span>Close</span>
    </button>
    <button *ngIf="isZoomed" type="button" class="viewer-control viewer-reset" (click)="resetView()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M3 10a9 9 0 1 1 2.7 8.4M3 4v6h6"></path>
        </svg>
        <span>Reset zoom</span>
    </button>
</div>
